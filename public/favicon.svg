<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="jarvisGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="reactorCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Chassis -->
  <rect width="128" height="128" rx="28" fill="#030712"/>
  <rect x="4" y="4" width="120" height="120" rx="24" fill="none" stroke="url(#jarvisGlow)" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Outer Arc Reactor Ring -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#082f49" stroke-width="6"/>
  <circle cx="64" cy="64" r="48" fill="none" stroke="url(#jarvisGlow)" stroke-width="2.5" stroke-dasharray="16 8 8 8" filter="url(#neonBlur)"/>

  <!-- Segmented Energy Coils -->
  <g stroke="url(#jarvisGlow)" stroke-width="3" stroke-linecap="round">
    <line x1="64" y1="12" x2="64" y2="24"/>
    <line x1="64" y1="104" x2="64" y2="116"/>
    <line x1="12" y1="64" x2="24" y2="64"/>
    <line x1="104" y1="64" x2="116" y2="64"/>
    <line x1="27" y1="27" x2="35" y2="35"/>
    <line x1="93" y1="93" x2="101" y2="101"/>
    <line x1="27" y1="101" x2="35" y2="93"/>
    <line x1="93" y1="35" x2="101" y2="27"/>
  </g>

  <!-- Inner HUD Dial -->
  <circle cx="64" cy="64" r="32" fill="#0c4a6e" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 3"/>

  <!-- Reactor Core Prism -->
  <polygon points="64,40 84,76 44,76" fill="none" stroke="url(#jarvisGlow)" stroke-width="2.5" filter="url(#neonBlur)"/>
  <circle cx="64" cy="64" r="14" fill="url(#reactorCore)" filter="url(#neonBlur)"/>
  <circle cx="64" cy="64" r="5" fill="#ffffff"/>
</svg>
